<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance</title>
  <meta name="theme-color" content="#0a2540" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>Attendance</h1>
  </header>

  <main>
    <!-- TEMPORARY: placement ID is typed in by hand because Auth/Placements
         (Jana's service) isn't wired up yet. Once login exists, this will
         come from the logged-in student's token instead, same as the
         placement_id TEMPORARY notes in AttendanceController. -->
    <section id="setup-card" class="card">
      <label for="placement-id">Placement ID</label>
      <input type="number" id="placement-id" placeholder="e.g. 1" />
      <button id="save-placement">Use this placement</button>
      <p id="active-placement" class="muted"></p>
    </section>

    <section id="stats-card" class="card hidden">
      <div class="stats-row">
        <div class="stat">
          <span class="stat-number" id="stat-approved">—</span>
          <span class="stat-label">Approved days</span>
        </div>
        <div class="stat">
          <span class="stat-number" id="stat-absent">—</span>
          <span class="stat-label">Absent days</span>
        </div>
      </div>
    </section>

    <section id="action-card" class="card hidden">
      <div id="today-status" class="status"></div>
      <button id="check-in-btn">Check in</button>
      <button id="check-out-btn">Check out</button>
      <p id="action-message" class="message"></p>
    </section>

    <section id="history-card" class="card hidden">
      <h2>My attendance</h2>
      <table id="history-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Check in</th>
            <th>Check out</th>
            <th>Hours</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
